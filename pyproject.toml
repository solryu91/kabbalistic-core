[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kabbalistic-core"
version = "0.1.0"
description = "A deterministic, inspectable cognitive graph organized by a Kabbalistic topology."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "All rights reserved; see LICENSE" }
authors = [{ name = "solryu91" }]
dependencies = ["cryptography>=45,<51"]

[project.scripts]
kabbalistic-core = "kabbalistic_core.cli:main"
seed-continuity = "kabbalistic_core.continuity_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kabbalistic_core = ["data/*.json"]
